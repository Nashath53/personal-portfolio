<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F0A"/>
      <stop offset="100%" style="stop-color:#0D1F0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#84CC16;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#0A0F0A;stop-opacity:0"/>
    </radialGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#84CC16" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Decorative corner lines -->
  <line x1="0" y1="0" x2="120" y2="0" stroke="#84CC16" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#84CC16" stroke-width="2" opacity="0.6"/>
  <line x1="800" y1="500" x2="680" y2="500" stroke="#84CC16" stroke-width="2" opacity="0.6"/>
  <line x1="800" y1="500" x2="800" y2="420" stroke="#84CC16" stroke-width="2" opacity="0.6"/>

  <!-- Browser chrome mockup -->
  <rect x="120" y="80" width="560" height="340" rx="10" fill="#0D1F0D" stroke="#84CC16" stroke-width="1" opacity="0.9"/>
  <!-- Browser top bar -->
  <rect x="120" y="80" width="560" height="36" rx="10" fill="#0A0F0A" stroke-width="0"/>
  <rect x="120" y="104" width="560" height="12" fill="#0A0F0A" stroke-width="0"/>
  <!-- Traffic lights -->
  <circle cx="145" cy="98" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="162" cy="98" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="179" cy="98" r="5" fill="#22C55E" opacity="0.8"/>
  <!-- URL bar -->
  <rect x="195" y="88" width="320" height="20" rx="4" fill="#0D1F0D" stroke="#84CC16" stroke-width="0.5" opacity="0.5"/>
  <text x="355" y="102" font-family="monospace" font-size="9" fill="#84CC16" text-anchor="middle" opacity="0.7">nashath53.github.io</text>

  <!-- Page content area inside browser -->
  <!-- Nav bar inside page -->
  <rect x="120" y="116" width="560" height="30" fill="#0A0F0A" opacity="0.6"/>
  <rect x="135" y="125" width="50" height="10" rx="3" fill="#84CC16" opacity="0.4"/>
  <rect x="530" y="125" width="30" height="10" rx="3" fill="#84CC16" opacity="0.25"/>
  <rect x="570" y="125" width="30" height="10" rx="3" fill="#84CC16" opacity="0.25"/>
  <rect x="610" y="125" width="40" height="10" rx="3" fill="#84CC16" opacity="0.6"/>

  <!-- Hero / content section inside page -->
  <rect x="135" y="158" width="250" height="16" rx="4" fill="#84CC16" opacity="0.7"/>
  <rect x="135" y="181" width="200" height="10" rx="3" fill="#ffffff" opacity="0.2"/>
  <rect x="135" y="198" width="230" height="10" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="135" y="215" width="180" height="10" rx="3" fill="#ffffff" opacity="0.12"/>
  <!-- CTA buttons -->
  <rect x="135" y="236" width="90" height="24" rx="5" fill="#84CC16" opacity="0.85"/>
  <rect x="234" y="236" width="80" height="24" rx="5" fill="none" stroke="#84CC16" stroke-width="1" opacity="0.6"/>

  <!-- Right side visual block inside page -->
  <rect x="420" y="150" width="240" height="200" rx="8" fill="#0A0F0A" stroke="#84CC16" stroke-width="1" opacity="0.5"/>
  <!-- Icon centered in right block -->
  <text x="540" y="265" font-size="56" text-anchor="middle" dominant-baseline="middle" opacity="0.5">🎮</text>

  <!-- Bottom cards row -->
  <rect x="135" y="290" width="160" height="80" rx="6" fill="#0A0F0A" stroke="#84CC16" stroke-width="0.8" opacity="0.4"/>
  <rect x="305" y="290" width="160" height="80" rx="6" fill="#0A0F0A" stroke="#84CC16" stroke-width="0.8" opacity="0.4"/>
  <rect x="475" y="290" width="160" height="80" rx="6" fill="#0A0F0A" stroke="#84CC16" stroke-width="0.8" opacity="0.3"/>

  <!-- Project title overlay at bottom -->
  <rect x="0" y="390" width="800" height="110" fill="#0A0F0A" opacity="0.85"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#84CC16" stroke-width="1" opacity="0.4"/>

  <!-- Accent dot -->
  <circle cx="48" cy="425" r="4" fill="#84CC16"/>
  <text x="62" y="420" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.95">Commando Strike</text>
  <text x="62" y="442" font-family="monospace" font-size="12" fill="#84CC16" opacity="0.8">2D Browser Game</text>

  <!-- Status badge -->
  <rect x="62" y="452" width="50" height="18" rx="9" fill="#84CC16" opacity="0.18"/>
  <circle cx="74" cy="461" r="3" fill="#84CC16" opacity="0.9"/>
  <text x="80" y="465" font-family="monospace" font-size="9" fill="#84CC16" opacity="0.9">Live</text>
</svg>